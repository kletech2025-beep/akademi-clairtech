name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage public files
        run: |
          mkdir -p _site/assets
          cp index.html styles.css app.js course.css kou-intro-chatgpt.html kou-ia-images.html kou-otomatisasyon.html kou-fine-tuning.html kou-langchain.html .nojekyll _site/
          rsync -a --exclude='.DS_Store' assets/ _site/assets/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
